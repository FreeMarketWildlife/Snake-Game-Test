<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sky Stack Sound Test</title><style>body{font-family:system-ui;background:#8ed8ff;color:#203044;padding:24px}button{display:block;width:100%;max-width:420px;margin:14px 0;padding:20px;font-size:18px;font-weight:800;border:3px solid #25374b;border-radius:10px;background:#fff9e9}.ok{background:#caffc8}.bad{background:#ffcaca}pre{white-space:pre-wrap;background:#fff;padding:12px;border:2px solid #25374b;border-radius:8px;max-width:420px}</style></head><body><h1>🔊 Sky Stack Sound Test</h1><p>Turn your iPhone media volume up, then tap each button.</p><button id="session">1. ENABLE iOS PLAYBACK MODE</button><button id="html">2. TEST HTML AUDIO</button><button id="web">3. TEST WEB AUDIO</button><pre id="log">Ready.</pre><script>const log=document.getElementById('log');function say(s){log.textContent+='\n'+s}function wav(freq=660,dur=.5){let sr=22050,n=Math.floor(sr*dur),b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++){let e=Math.min(1,i/100)*Math.min(1,(n-i)/300),s=Math.sin(2*Math.PI*freq*i/sr)*.8*e;v.setInt16(44+i*2,s*32767,true)}return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}const src=wav();session.onclick=()=>{try{if('audioSession'in navigator){navigator.audioSession.type='playback';say('audioSession supported → type='+navigator.audioSession.type);session.className='ok'}else{say('navigator.audioSession NOT supported in this browser');session.className='bad'}}catch(e){say('audioSession error: '+e);session.className='bad'}};html.onclick=async()=>{try{if('audioSession'in navigator)navigator.audioSession.type='playback';let a=new Audio();a.src=src;a.volume=1;a.preload='auto';document.body.appendChild(a);await a.play();say('HTML Audio play() SUCCESS. You should hear a beep.');html.className='ok';setTimeout(()=>a.remove(),1200)}catch(e){say('HTML Audio FAILED: '+e.name+' '+e.message);html.className='bad'}};web.onclick=async()=>{try{if('audioSession'in navigator)navigator.audioSession.type='playback';let AC=window.AudioContext||window.webkitAudioContext,ac=new AC({latencyHint:'interactive'});await ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=440;o.type='square';g.gain.value=.3;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.5);say('WebAudio state='+ac.state+'. You should hear a lower beep.');web.className='ok'}catch(e){say('WebAudio FAILED: '+e.name+' '+e.message);web.className='bad'}};</script></body></html>
