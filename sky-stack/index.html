<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8ed8ff"><title>Sky Stack</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed8ff;touch-action:none;overscroll-behavior:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#203044}#app{position:fixed;inset:0;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.badge,.pix{border:3px solid #25374b;background:#fff9e9;box-shadow:4px 4px 0 #1f31443d;border-radius:6px}.badge{padding:8px 10px;display:flex;flex-direction:column;line-height:1}.badge small{font-size:9px;font-weight:900;letter-spacing:1px;opacity:.65;margin-bottom:4px}.badge strong{font-size:17px}.cam{display:flex;gap:8px;pointer-events:auto}.pix{appearance:none;color:#203044;font:900 11px/1 ui-monospace,monospace;padding:10px 9px}.pix:active{transform:translate(2px,2px)}#mode{position:absolute;top:max(65px,calc(env(safe-area-inset-top) + 65px));left:50%;transform:translateX(-50%);padding:6px 10px;background:#fff9e9d9;border:2px solid #25374b;border-radius:999px;font-size:9px;font-weight:900;white-space:nowrap;pointer-events:none}#bar{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));height:78px;display:flex;justify-content:center;gap:6px;padding:7px;border:3px solid #25374b;background:#fff9eef5;border-radius:8px}.slot{position:relative;flex:1;max-width:88px;min-width:59px;display:grid;grid-template-rows:42px 14px;place-items:center;border:3px solid #52657a;background:#e8e0ca;color:#203044;border-radius:5px;padding:3px;font-family:inherit;font-weight:900}.slot.sel{border-color:#1e3348;background:#fff7d7;transform:translateY(-4px);box-shadow:0 5px 0 #25374b}.slot.empty{filter:grayscale(1);opacity:.42}.slot.locked{filter:grayscale(1);opacity:.28}.icon{font-size:29px}.lab{font-size:8px}.blk{position:relative;width:34px;height:34px;border:3px solid #213142bf}.dirt{background:repeating-linear-gradient(135deg,#8b5a34 0 5px,#a86e3f 5px 9px,#7d4e2d 9px 12px)}.stone{background:repeating-linear-gradient(135deg,#727983 0 6px,#8e949c 6px 10px,#626973 10px 14px)}.num{position:absolute;right:-10px;top:-10px;min-width:25px;height:25px;padding:0 4px;display:grid;place-items:center;border:3px solid #25374b;border-radius:50%;background:#fff;color:#17283a;font-size:11px;font-weight:1000;z-index:3;box-shadow:2px 2px 0 #25374b55}#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);min-width:230px;max-width:84vw;padding:13px 15px;border:3px solid #25374b;background:#fff6ce;box-shadow:5px 5px 0 #21324538;border-radius:5px;text-align:center;font-weight:950;font-size:12px;pointer-events:none;transition:.2s;white-space:pre-line}#toast.hide{opacity:0;transform:translate(-50%,-30%)}#load{position:absolute;inset:0;display:grid;place-items:center;background:#8ed8ff;font-weight:900;z-index:10}@media(min-width:700px){#bar{left:50%;right:auto;transform:translateX(-50%);width:440px}}</style></head><body><div id="app"><canvas id="game"></canvas><div id="hud"><div class="badge"><small>HEIGHT</small><strong id="height">0 m</strong></div><div class="cam"><button class="pix" id="top">▲ TOP</button><button class="pix" id="ground">▼ GROUND</button></div></div><div id="mode">⛏ PICKAXE · tap mine / drag look</div><div id="bar"><button class="slot sel" data-tool="pick"><span class="icon">⛏</span><span class="lab">PICK</span></button><button class="slot empty" data-tool="dirt"><span class="blk dirt"><b class="num" id="dc">0</b></span><span class="lab">DIRT</span></button><button class="slot empty" data-tool="stone"><span class="blk stone"><b class="num" id="sc">0</b></span><span class="lab">STONE</span></button><button class="slot locked" disabled><span class="blk" style="background:#7e8792;display:grid;place-items:center;color:white">?</span><span class="lab">???</span></button></div><div id="toast" class="hide"></div><div id="load">Loading physics…</div></div><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script>(()=>{'use strict';if(!window.Matter){load.textContent='Physics failed to load';return}const{Engine,World,Bodies,Body,Query,Sleeping}=Matter,c=document.getElementById('game'),x=c.getContext('2d',{alpha:false});const B=32,H=16,WW=28,DIRT=6,DEPTH=34,FLOOR=(DEPTH+2)*B,MATS={dirt:{taps:1,density:.0017,friction:.74,restitution:.13,air:.012,colors:['#98633a','#81502e','#b27845']},stone:{taps:3,density:.0028,friction:.88,restitution:.055,air:.009,colors:['#777f89','#626a74','#9198a1']}};const inv={dirt:0,stone:0},bodies=new Set(),grid=new Map(),touches=new Map(),cam={x:0,y:-180,z:1,tx:0,ty:-180,tz:1,anim:false};let tool='pick',gesture=null,timer=null,best=0,solidUnlocked=false;const eng=Engine.create({enableSleeping:true});eng.gravity.y=1.05;eng.gravity.scale=.001;eng.positionIterations=8;eng.velocityIterations=6;let W=innerWidth,HH=innerHeight,DPR=Math.min(devicePixelRatio||1,2);const key=(a,b)=>a+','+b,center=i=>i*B+H,cell=v=>Math.floor(v/B),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function mk(px,py,m,o={}){const q=MATS[m],bw=o.w||B-1,bh=o.h||B-1,z=Bodies.rectangle(px,py,bw,bh,{isStatic:!!o.static,density:q.density,friction:q.friction,frictionStatic:Math.min(1,q.friction+.1),restitution:q.restitution,frictionAir:q.air,chamfer:{radius:Math.min(2,Math.min(bw,bh)*.04)},sleepThreshold:70,label:'block:'+m});z.game={material:m,terrain:!!o.terrain,hits:0,max:q.taps,cx:o.cx??null,cy:o.cy??null,born:performance.now(),w:bw,h:bh,cost:o.cost||1};bodies.add(z);if(o.terrain)grid.set(key(o.cx,o.cy),z);World.add(eng.world,z);return z}for(let cy=0;cy<DEPTH;cy++)for(let cx=-WW;cx<WW;cx++)mk(center(cx),center(cy),cy<DIRT?'dirt':'stone',{static:true,terrain:true,cx,cy});World.add(eng.world,Bodies.rectangle(0,FLOOR+B,WW*B*3,B*2,{isStatic:true,label:'bedrock'}));function resize(){W=innerWidth;HH=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*DPR);c.height=Math.round(HH*DPR);c.style.width=W+'px';c.style.height=HH+'px'}addEventListener('resize',resize,{passive:true});resize();const w2s=(px,py)=>({x:(px-cam.x)*cam.z+W/2,y:(py-cam.y)*cam.z+HH/2}),s2w=(px,py)=>({x:(px-W/2)/cam.z+cam.x,y:(py-HH/2)/cam.z+cam.y});function at(p){const h=Query.point([...bodies],p);h.sort((a,b)=>(b.game?.born||0)-(a.game?.born||0));return h[0]||null}function updateMode(){mode.textContent=tool===null?'👁 VIEWER MODE · drag to look':tool==='pick'?'⛏ PICKAXE · tap mine / drag look':solidUnlocked?'▰ '+tool.toUpperCase()+' · tap 1×1 / drag solid shape':'■ '+tool.toUpperCase()+' · tap to place'}function updateUI(){dc.textContent=inv.dirt;sc.textContent=inv.stone;for(const m of ['dirt','stone'])document.querySelector('[data-tool='+m+']').classList.toggle('empty',!inv[m]);updateMode()}function toast(t,long=false){clearTimeout(timer);const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');timer=setTimeout(()=>e.classList.add('hide'),long?2800:1300)}function remove(z,mined){if(!z||!bodies.has(z))return;if(mined)inv[z.game.material]+=z.game.cost||1;if(z.game.terrain)grid.delete(key(z.game.cx,z.game.cy));bodies.delete(z);World.remove(eng.world,z);updateUI()}function collapse(px,py){const cx=cell(px),cy=cell(py),list=[];for(let r=1;r<=5;r++)for(let y=Math.max(0,cy-r);y<=Math.min(DEPTH-1,cy+1);y++)for(let xx=cx-r;xx<=cx+r;xx++){const z=grid.get(key(xx,y));if(!z||!z.isStatic)continue;const below=grid.get(key(xx,y+1)),sides=[grid.get(key(xx-1,y)),grid.get(key(xx+1,y))].filter(n=>n&&n.isStatic).length;if(!below&&sides<2)list.push(z)}[...new Set(list)].slice(0,18).forEach((z,i)=>setTimeout(()=>{if(!bodies.has(z))return;Body.setStatic(z,false);z.game.terrain=false;grid.delete(key(z.game.cx,z.game.cy));z.game.cx=z.game.cy=null;Body.setVelocity(z,{x:(Math.random()-.5)*.3,y:.1})},i*24))}function mine(p){const z=at(p);if(!z||z.label==='bedrock')return;z.game.hits++;z.game.flash=8;if(z.game.hits>=z.game.max){const px=z.position.x,py=z.position.y;remove(z,true);collapse(px,py)}else Body.applyForce(z,z.position,{x:(Math.random()-.5)*.00004,y:-.000035})}function rect(a,b){const ax=cell(a.x),ay=cell(a.y),bx=cell(b.x),by=cell(b.y),minx=Math.min(ax,bx),maxx=Math.max(ax,bx),miny=Math.min(ay,by),maxy=Math.max(ay,by);return{minx,maxx,miny,maxy,nx:maxx-minx+1,ny:maxy-miny+1,cost:(maxx-minx+1)*(maxy-miny+1)}}function regionFree(r){const min={x:r.minx*B+2,y:r.miny*B+2},max={x:(r.maxx+1)*B-2,y:(r.maxy+1)*B-2};return Query.region([...bodies],{min,max}).length===0}function placeOne(m,p){if(!inv[m])return toast('NO '+m.toUpperCase()+' — MINE SOME!');const q={minx:cell(p.x),maxx:cell(p.x),miny:cell(p.y),maxy:cell(p.y)};if(!regionFree(q))return;inv[m]--;mk(center(q.minx),center(q.miny),m);updateUI()}function placeSolid(m,a,b){const r=rect(a,b);if(r.cost===1)return placeOne(m,b);if(!solidUnlocked)return placeOne(m,b);if(r.cost>120)return toast('THAT PIECE IS TOO BIG!');if(inv[m]<r.cost)return toast('NEED '+r.cost+' '+m.toUpperCase()+' · HAVE '+inv[m]);if(!regionFree(r))return toast('SPACE IS BLOCKED');const px=(r.minx+r.maxx+1)*B/2,py=(r.miny+r.maxy+1)*B/2;inv[m]-=r.cost;mk(px,py,m,{w:r.nx*B-1,h:r.ny*B-1,cost:r.cost});updateUI()}bar.addEventListener('pointerdown',e=>e.stopPropagation());bar.addEventListener('click',e=>{const b=e.target.closest('.slot[data-tool]');if(!b)return;const t=b.dataset.tool;if(tool===t){tool=null;document.querySelectorAll('.slot').forEach(s=>s.classList.remove('sel'));updateUI();toast('VIEWER MODE');return}if(t!=='pick'&&!inv[t]){toast('MINE '+t.toUpperCase()+' FIRST');return}tool=t;document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('sel',s===b));updateUI()});function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function pan(dx,dy){cam.anim=false;cam.x-=dx/cam.z;cam.y-=dy/cam.z}function beginMulti(){cam.anim=false;const p=[...touches.values()],a=p[0],b=p[1];return{type:'multi',mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},dist:Math.max(12,Math.hypot(a.x-b.x,a.y-b.y))}}c.addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('pointerdown',e=>{c.setPointerCapture?.(e.pointerId);const s=pos(e);touches.set(e.pointerId,s);if(touches.size>=2){gesture=beginMulti();return}const w=s2w(s.x,s.y);gesture={type:'play',id:e.pointerId,start:s,last:s,a:w,b:w,moved:false,tool,time:performance.now()}});c.addEventListener('pointermove',e=>{const s=pos(e);if(touches.has(e.pointerId))touches.set(e.pointerId,s);if(touches.size>=2){if(!gesture||gesture.type!=='multi')gesture=beginMulti();const p=[...touches.values()],a=p[0],b=p[1],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},dist=Math.max(12,Math.hypot(a.x-b.x,a.y-b.y));pan(mid.x-gesture.mid.x,mid.y-gesture.mid.y);cam.z=clamp(cam.z*(dist/gesture.dist),.42,2.25);gesture.mid=mid;gesture.dist=dist;return}if(!gesture||gesture.type!=='play'||gesture.id!==e.pointerId)return;gesture.b=s2w(s.x,s.y);const d=Math.hypot(s.x-gesture.start.x,s.y-gesture.start.y);if(d>9)gesture.moved=true;if((gesture.tool===null||gesture.tool==='pick')&&gesture.moved){pan(s.x-gesture.last.x,s.y-gesture.last.y)}gesture.last=s});function end(e){touches.delete(e.pointerId);if(!gesture)return;if(gesture.type==='multi'){if(touches.size<2)gesture=null;return}if(gesture.id!==e.pointerId)return;const g=gesture;gesture=null;if(g.tool===null)return;if(g.tool==='pick'){if(!g.moved)mine(g.b);return}if(!g.moved)placeOne(g.tool,g.b);else if(solidUnlocked)placeSolid(g.tool,g.a,g.b)}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('wheel',e=>{e.preventDefault();cam.anim=false;cam.z=clamp(cam.z*(e.deltaY<0?1.1:.9),.42,2.25)},{passive:false});function highY(){let y=0;for(const z of bodies)if(!z.game?.terrain&&z.position.y-z.game.h/2<y)y=z.position.y-z.game.h/2;return y}function go(y,z=cam.z){cam.tx=0;cam.ty=y;cam.tz=z;cam.anim=true}ground.onclick=()=>go(-110,1);top.onclick=()=>go(Math.min(-150,highY()+100));function bg(){const alt=Math.max(0,-cam.y/(B*12)),t=clamp(alt/10,0,1),a=[142,216,255],b=[17,26,55],d=[209,239,255],e=[55,74,108],mix=(q,r)=>`rgb(${q.map((v,i)=>Math.round(v+(r[i]-v)*t)).join(',')})`,g=x.createLinearGradient(0,0,0,HH);g.addColorStop(0,mix(a,b));g.addColorStop(1,mix(d,e));x.fillStyle=g;x.fillRect(0,0,W,HH);if(t>.15){x.save();x.globalAlpha=clamp((t-.15)*1.2,0,.8);x.fillStyle='#fff';for(let i=0;i<45;i++)x.fillRect(((i*137+29)%997)/997*W,((i*233+71)%991)/991*HH*.72,i%5?1:2,i%5?1:2);x.restore()}const l=w2s(-WW*B,0),r=w2s(WW*B,0);if(l.y>-100&&l.y<HH+100){x.fillStyle='#72b552';x.fillRect(l.x,l.y-5*cam.z,r.x-l.x,6*cam.z)}}function drawBlock(z){const s=w2s(z.position.x,z.position.y),sw=z.game.w*cam.z,sh=z.game.h*cam.z;if(s.x<-sw||s.x>W+sw||s.y<-sh||s.y>HH+sh)return;const m=MATS[z.game.material];x.save();x.translate(Math.round(s.x),Math.round(s.y));x.rotate(z.angle);x.fillStyle=m.colors[0];x.fillRect(-sw/2,-sh/2,sw,sh);x.fillStyle=m.colors[1];x.fillRect(-sw/2,sh/2-Math.max(2,3*cam.z),sw,Math.max(2,3*cam.z));x.fillRect(-sw/2,-sh/2,Math.max(1,2*cam.z),sh);x.fillStyle=m.colors[2];for(let xx=-sw/2+7;xx<sw/2-5;xx+=B*cam.z)x.fillRect(xx,-sh/2+6,Math.min(10,sw/4),Math.max(1,cam.z));if(z.game.flash>0){x.strokeStyle='#fff7b0';x.lineWidth=3;x.strokeRect(-sw/2+2,-sh/2+2,sw-4,sh-4);z.game.flash--}x.restore()}function preview(){if(!gesture||gesture.type!=='play'||!MATS[gesture.tool]||!solidUnlocked||!gesture.moved)return;const r=rect(gesture.a,gesture.b),s=w2s((r.minx+r.maxx+1)*B/2,(r.miny+r.maxy+1)*B/2),sw=r.nx*B*cam.z,sh=r.ny*B*cam.z;x.save();x.globalAlpha=inv[gesture.tool]>=r.cost?.38:.14;x.fillStyle=MATS[gesture.tool].colors[0];x.fillRect(s.x-sw/2,s.y-sh/2,sw,sh);x.globalAlpha=.9;x.strokeStyle='#25374b';x.lineWidth=2;x.strokeRect(s.x-sw/2,s.y-sh/2,sw,sh);x.fillStyle='#fff';x.font='900 11px monospace';x.fillText(r.nx+'×'+r.ny+' · '+r.cost,s.x-sw/2+5,s.y-sh/2-6);x.restore()}function animate(){if(!cam.anim)return;cam.x+=(cam.tx-cam.x)*.12;cam.y+=(cam.ty-cam.y)*.12;cam.z+=(cam.tz-cam.z)*.1;if(Math.abs(cam.tx-cam.x)<.4&&Math.abs(cam.ty-cam.y)<.4)cam.anim=false}let last=performance.now();function loop(now){const dt=Math.min(33,now-last||16.7);last=now;Engine.update(eng,dt);animate();const meters=Math.max(0,Math.floor(-highY()/B+.5));best=Math.max(best,meters);if(best>=5&&!solidUnlocked){solidUnlocked=true;updateUI();toast('★ NEW BUILDING TECHNIQUE! ★\nDRAG MATERIALS TO MAKE SOLID BLOCKS',true)}height.textContent=meters+' m';x.setTransform(DPR,0,0,DPR,0,0);bg();[...bodies].sort((a,b)=>a.position.y-b.position.y).forEach(drawBlock);preview();requestAnimationFrame(loop)}updateUI();load.remove();toast('MINE DOWN. BUILD UP.');requestAnimationFrame(loop)})();</script></body></html>
