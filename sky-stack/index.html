<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#8ed8ff" />
<title>Sky Stack</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed8ff;touch-action:none;overscroll-behavior:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#203044}#app{position:fixed;inset:0;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.badge,.pix{border:3px solid #25374b;background:#fff9e9;box-shadow:4px 4px 0 rgba(31,49,68,.24);border-radius:6px}.badge{padding:8px 10px;display:flex;flex-direction:column;line-height:1}.badge small{font-size:9px;font-weight:900;letter-spacing:1px;opacity:.65;margin-bottom:4px}.badge strong{font-size:17px}.cam{display:flex;gap:8px;pointer-events:auto}.pix{appearance:none;color:#203044;font:900 11px/1 ui-monospace,monospace;padding:10px 9px}.pix:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(31,49,68,.24)}#hint{position:absolute;top:max(66px,calc(env(safe-area-inset-top) + 66px));left:50%;transform:translateX(-50%);padding:5px 8px;background:rgba(255,255,255,.72);border-radius:999px;font-size:9px;font-weight:800;white-space:nowrap;opacity:.78;pointer-events:none}#bar{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));height:82px;display:flex;justify-content:center;gap:6px;padding:7px;border:3px solid #25374b;background:rgba(255,249,233,.96);border-radius:8px}.slot{position:relative;flex:1;max-width:88px;min-width:59px;display:grid;grid-template-rows:34px 14px 16px;place-items:center;border:3px solid #52657a;background:#e8e0ca;color:#203044;border-radius:5px;padding:3px;font-family:inherit;font-weight:900}.slot.sel{border-color:#1e3348;background:#fff7d7;transform:translateY(-4px);box-shadow:0 5px 0 #25374b}.slot.empty{filter:grayscale(1);opacity:.42}.slot.locked{filter:grayscale(1);opacity:.28}.icon{font-size:27px}.lab{font-size:8px}.count{font-size:12px}.blk{width:29px;height:29px;border:3px solid rgba(33,49,66,.75)}.dirt{background:repeating-linear-gradient(135deg,#8b5a34 0 5px,#a86e3f 5px 9px,#7d4e2d 9px 12px)}.stone{background:repeating-linear-gradient(135deg,#727983 0 6px,#8e949c 6px 10px,#626973 10px 14px)}#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);min-width:210px;max-width:82vw;padding:12px 15px;border:3px solid #25374b;background:#fff6ce;box-shadow:5px 5px 0 rgba(33,50,69,.22);border-radius:5px;text-align:center;font-weight:950;font-size:12px;pointer-events:none;transition:.2s}#toast.hide{opacity:0;transform:translate(-50%,-30%)}#load{position:absolute;inset:0;display:grid;place-items:center;background:#8ed8ff;font-weight:900;z-index:10}@media(min-width:700px){#bar{left:50%;right:auto;transform:translateX(-50%);width:440px}}
</style>
</head>
<body><div id="app">
<canvas id="game"></canvas>
<div id="hud"><div class="badge"><small>HEIGHT</small><strong id="height">0 m</strong></div><div class="cam"><button class="pix" id="top">▲ TOP</button><button class="pix" id="ground">▼ GROUND</button></div></div>
<div id="hint">One finger: play · Two fingers: move / zoom</div>
<div id="bar">
<button class="slot sel" data-tool="pick"><span class="icon">⛏</span><span class="lab">PICK</span><span class="count">∞</span></button>
<button class="slot empty" data-tool="dirt"><span class="blk dirt"></span><span class="lab">DIRT</span><span class="count" id="dc">0</span></button>
<button class="slot empty" data-tool="stone"><span class="blk stone"></span><span class="lab">STONE</span><span class="count" id="sc">0</span></button>
<button class="slot locked" disabled><span class="blk" style="background:#7e8792;display:grid;place-items:center;color:white">?</span><span class="lab">???</span><span class="count">—</span></button>
</div><div id="toast" class="hide"></div><div id="load">Loading physics…</div></div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script>
(()=>{'use strict';if(!window.Matter){load.textContent='Physics failed to load';return}
const {Engine,World,Bodies,Body,Query,Sleeping}=Matter,c=document.getElementById('game'),x=c.getContext('2d',{alpha:false});
const B=32,H=16,WW=28,DIRT=6,DEPTH=34,FLOOR=(DEPTH+2)*B,MATS={dirt:{taps:1,density:.0017,friction:.74,restitution:.13,air:.012,colors:['#98633a','#81502e','#b27845']},stone:{taps:3,density:.0028,friction:.88,restitution:.055,air:.009,colors:['#777f89','#626a74','#9198a1']}};
const inv={dirt:0,stone:0},bodies=new Set(),grid=new Map();let tool='pick',gesture=null,frame=0,timer=null;const touches=new Map(),cam={x:0,y:-180,z:1,tx:0,ty:-180,tz:1,anim:false};
const eng=Engine.create({enableSleeping:true});eng.gravity.y=1.05;eng.gravity.scale=.001;eng.positionIterations=8;eng.velocityIterations=6;
let W=innerWidth,HH=innerHeight,DPR=Math.min(devicePixelRatio||1,2);function key(a,b){return a+','+b}function center(i){return i*B+H}function cell(v){return Math.floor(v/B)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function mk(px,py,m,o={}){const q=MATS[m],z=Bodies.rectangle(px,py,B-1,B-1,{isStatic:!!o.static,density:q.density,friction:q.friction,frictionStatic:Math.min(1,q.friction+.1),restitution:q.restitution,frictionAir:q.air,chamfer:{radius:1.2},sleepThreshold:70,label:'block:'+m});z.game={material:m,terrain:!!o.terrain,hits:0,max:q.taps,cx:o.cx??null,cy:o.cy??null,born:performance.now()};bodies.add(z);if(o.terrain)grid.set(key(o.cx,o.cy),z);World.add(eng.world,z);return z}
for(let cy=0;cy<DEPTH;cy++)for(let cx=-WW;cx<WW;cx++)mk(center(cx),center(cy),cy<DIRT?'dirt':'stone',{static:true,terrain:true,cx,cy});World.add(eng.world,Bodies.rectangle(0,FLOOR+B,WW*B*3,B*2,{isStatic:true,label:'bedrock'}));
function resize(){W=innerWidth;HH=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*DPR);c.height=Math.round(HH*DPR);c.style.width=W+'px';c.style.height=HH+'px';x.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function w2s(px,py){return{x:(px-cam.x)*cam.z+W/2,y:(py-cam.y)*cam.z+HH/2}}function s2w(px,py){return{x:(px-W/2)/cam.z+cam.x,y:(py-HH/2)/cam.z+cam.y}}
function at(p){const h=Query.point([...bodies],p);h.sort((a,b)=>(b.game?.born||0)-(a.game?.born||0));return h[0]||null}
function updateUI(){dc.textContent=inv.dirt;sc.textContent=inv.stone;document.querySelector('[data-tool=dirt]').classList.toggle('empty',!inv.dirt);document.querySelector('[data-tool=stone]').classList.toggle('empty',!inv.stone)}
function toast(t){clearTimeout(timer);const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');timer=setTimeout(()=>e.classList.add('hide'),1200)}
function remove(z,mined){if(!z||!bodies.has(z))return;if(mined)inv[z.game.material]++;if(z.game.terrain)grid.delete(key(z.game.cx,z.game.cy));bodies.delete(z);World.remove(eng.world,z);updateUI()}
function collapse(px,py){const cx=cell(px),cy=cell(py),list=[];for(let r=1;r<=5;r++)for(let y=Math.max(0,cy-r);y<=Math.min(DEPTH-1,cy+1);y++)for(let xx=cx-r;xx<=cx+r;xx++){const z=grid.get(key(xx,y));if(!z||!z.isStatic)continue;const below=grid.get(key(xx,y+1)),sides=[grid.get(key(xx-1,y)),grid.get(key(xx+1,y))].filter(n=>n&&n.isStatic).length;if(!below&&sides<2)list.push(z)}[...new Set(list)].slice(0,18).forEach((z,i)=>setTimeout(()=>{if(!bodies.has(z))return;Body.setStatic(z,false);z.game.terrain=false;grid.delete(key(z.game.cx,z.game.cy));z.game.cx=z.game.cy=null;Body.setVelocity(z,{x:(Math.random()-.5)*.3,y:.1})},i*24))}
function mine(p){const z=at(p);if(!z||z.label==='bedrock')return;z.game.hits++;z.game.flash=8;if(z.game.hits>=z.game.max){const px=z.position.x,py=z.position.y;remove(z,true);collapse(px,py)}else Body.applyForce(z,z.position,{x:(Math.random()-.5)*.00004,y:-.000035})}
function cells(a,b){const ax=cell(a.x),ay=cell(a.y),bx=cell(b.x),by=cell(b.y),out=[];for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++)for(let xx=Math.min(ax,bx);xx<=Math.max(ax,bx);xx++)out.push({x:xx,y});return out}
function place(m,a,b){let arr=cells(a,b).slice(0,120),have=inv[m],made=0;arr=arr.slice(0,have);for(const q of arr){const px=center(q.x),py=center(q.y),occ=Query.region([...bodies],{min:{x:px-H+3,y:py-H+3},max:{x:px+H-3,y:py+H-3}}).length;if(occ)continue;inv[m]--;const z=mk(px,py,m);Sleeping.set(z,false);made++}updateUI();if(!made&&!have)toast('NO '+m.toUpperCase()+' — MINE SOME!')}
bar.addEventListener('pointerdown',e=>e.stopPropagation());bar.addEventListener('click',e=>{const b=e.target.closest('.slot[data-tool]');if(!b)return;const t=b.dataset.tool;if(t!=='pick'&&!inv[t]){toast('MINE '+t.toUpperCase()+' FIRST');return}tool=t;document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('sel',s===b))});
function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function beginCam(){cam.anim=false;const p=[...touches.values()];if(p.length>=2){const a=p[0],b=p[1];return{type:'cam',mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},dist:Math.hypot(a.x-b.x,a.y-b.y)}}return{type:'cam',last:p[0]||null}}
c.addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('pointerdown',e=>{c.setPointerCapture?.(e.pointerId);const s=pos(e);touches.set(e.pointerId,s);if(touches.size>=2||e.button===2||e.button===1||e.shiftKey){gesture=beginCam();return}const w=s2w(s.x,s.y);gesture={type:'play',id:e.pointerId,start:s,a:w,b:w,moved:false,tool,time:performance.now()}});
c.addEventListener('pointermove',e=>{const s=pos(e);if(touches.has(e.pointerId))touches.set(e.pointerId,s);if(touches.size>=2){if(!gesture||gesture.type!=='cam')gesture=beginCam();const p=[...touches.values()],a=p[0],b=p[1],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},dist=Math.max(12,Math.hypot(a.x-b.x,a.y-b.y)),before=s2w(mid.x,mid.y);cam.x-=(mid.x-gesture.mid.x)/cam.z;cam.y-=(mid.y-gesture.mid.y)/cam.z;cam.z=clamp(cam.z*(dist/Math.max(12,gesture.dist)),.42,2.25);const after=s2w(mid.x,mid.y);cam.x+=before.x-after.x;cam.y+=before.y-after.y;gesture.mid=mid;gesture.dist=dist;return}if(!gesture)return;if(gesture.type==='cam'){if(e.buttons&&gesture.last){cam.x-=(s.x-gesture.last.x)/cam.z;cam.y-=(s.y-gesture.last.y)/cam.z;gesture.last=s}return}if(gesture.id!==e.pointerId)return;gesture.b=s2w(s.x,s.y);if(Math.hypot(s.x-gesture.start.x,s.y-gesture.start.y)>8)gesture.moved=true});
function end(e){touches.delete(e.pointerId);if(!gesture)return;if(gesture.type==='cam'){if(touches.size<2)gesture=null;return}if(gesture.id!==e.pointerId)return;const g=gesture;gesture=null;if(g.tool==='pick'){if(!g.moved||performance.now()-g.time<230)mine(g.b)}else place(g.tool,g.a,g.b)}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
c.addEventListener('wheel',e=>{e.preventDefault();cam.anim=false;const s=pos(e),before=s2w(s.x,s.y),f=e.deltaY<0?1.1:.9;cam.z=clamp(cam.z*f,.42,2.25);const after=s2w(s.x,s.y);cam.x+=before.x-after.x;cam.y+=before.y-after.y},{passive:false});
function highY(){let y=0;for(const z of bodies)if(!z.game?.terrain&&z.position.y<y)y=z.position.y;return y}function go(y,z=cam.z){cam.tx=0;cam.ty=y;cam.tz=z;cam.anim=true}ground.onclick=()=>go(-110,1);top.onclick=()=>go(Math.min(-150,highY()+100));
function bg(){const alt=Math.max(0,-s2w(0,0).y/(B*12)),t=clamp(alt/10,0,1),a=[142,216,255],b=[17,26,55],d=[209,239,255],e=[55,74,108],mix=(q,r)=>`rgb(${q.map((v,i)=>Math.round(v+(r[i]-v)*t)).join(',')})`,g=x.createLinearGradient(0,0,0,HH);g.addColorStop(0,mix(a,b));g.addColorStop(1,mix(d,e));x.fillStyle=g;x.fillRect(0,0,W,HH);if(t>.15){x.save();x.globalAlpha=clamp((t-.15)*1.2,0,.8);x.fillStyle='#fff';for(let i=0;i<45;i++)x.fillRect(((i*137+29)%997)/997*W,((i*233+71)%991)/991*HH*.72,i%5?1:2,i%5?1:2);x.restore()}const gy=w2s(-WW*B,0),gr=w2s(WW*B,0);if(gy.y>-100&&gy.y<HH+100){x.fillStyle='#72b552';x.fillRect(gy.x,gy.y-5*cam.z,gr.x-gy.x,6*cam.z)}}
function drawBlock(z){const s=w2s(z.position.x,z.position.y),size=B*cam.z;if(s.x<-size||s.x>W+size||s.y<-size||s.y>HH+size)return;const m=MATS[z.game.material],h=(size-Math.max(1,cam.z))/2;x.save();x.translate(Math.round(s.x),Math.round(s.y));x.rotate(z.angle);x.fillStyle=m.colors[0];x.fillRect(-h,-h,h*2,h*2);x.fillStyle=m.colors[1];x.fillRect(-h,h-3*cam.z,h*2,3*cam.z);x.fillRect(-h,-h,2*cam.z,h*2);x.fillStyle=m.colors[2];x.fillRect(-h+4*cam.z,-h+4*cam.z,Math.max(2,h*.6),Math.max(1,cam.z));if(z.game.flash>0){x.strokeStyle='#fff7b0';x.lineWidth=Math.max(2,3*cam.z);x.strokeRect(-h+2,-h+2,h*2-4,h*2-4);z.game.flash--}if(z.game.hits>0&&z.game.max>1){x.strokeStyle='rgba(35,43,52,.65)';x.lineWidth=Math.max(1,cam.z);x.beginPath();x.moveTo(-h*.15,-h*.25);x.lineTo(h*.08,-h*.02);x.lineTo(-h*.04,h*.15);x.stroke()}x.restore()}
function preview(){if(!gesture||gesture.type!=='play'||!MATS[gesture.tool])return;const arr=cells(gesture.a,gesture.b).slice(0,120),have=inv[gesture.tool];x.save();arr.forEach((q,i)=>{const s=w2s(center(q.x),center(q.y)),sz=B*cam.z;x.globalAlpha=i<have?.38:.12;x.fillStyle=MATS[gesture.tool].colors[0];x.fillRect(s.x-sz/2,s.y-sz/2,sz,sz);x.strokeStyle='#263749';x.strokeRect(s.x-sz/2,s.y-sz/2,sz,sz)});x.restore()}
function animate(){if(!cam.anim)return;cam.x+=(cam.tx-cam.x)*.12;cam.y+=(cam.ty-cam.y)*.12;cam.z+=(cam.tz-cam.z)*.1;if(Math.abs(cam.tx-cam.x)<.4&&Math.abs(cam.ty-cam.y)<.4)cam.anim=false}
let last=performance.now();function loop(now){const dt=Math.min(33,now-last||16.7);last=now;Engine.update(eng,dt);animate();const meters=Math.max(0,Math.round((0-(highY()-H))/B));height.textContent=meters+' m';x.setTransform(DPR,0,0,DPR,0,0);bg();[...bodies].sort((a,b)=>a.position.y-b.position.y).forEach(drawBlock);preview();frame++;requestAnimationFrame(loop)}
updateUI();load.remove();setTimeout(()=>hint.style.opacity='.15',6500);toast('MINE DOWN. BUILD UP.');requestAnimationFrame(loop);
})();
</script></body></html>
