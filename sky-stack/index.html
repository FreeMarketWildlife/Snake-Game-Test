<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8ed8ff"><title>Sky Stack</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:ui-monospace,Menlo,monospace;color:#203044}#app,canvas{position:fixed;inset:0;width:100%;height:100%}canvas{image-rendering:pixelated;touch-action:none}#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.panel,.btn,#quest,#bar,#mode{border:3px solid #25374b;background:#fff9e9;box-shadow:4px 4px 0 #1f31443d;border-radius:7px}.panel{padding:7px 9px;line-height:1}.panel small{font-size:8px;font-weight:900;opacity:.65}.panel b{display:block;font-size:17px;margin-top:4px}.cams{display:flex;gap:6px;pointer-events:auto}.btn{appearance:none;color:#203044;font:900 10px ui-monospace,monospace;padding:9px 8px}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1f31443d}#quest{position:absolute;top:max(67px,calc(env(safe-area-inset-top) + 67px));left:10px;width:166px;padding:8px 9px;font-weight:900;pointer-events:none}#quest small{font-size:8px;letter-spacing:1px;opacity:.58}#questTitle{font-size:11px;margin-top:4px}#questSub{font-size:8px;margin-top:4px;line-height:1.3;opacity:.72}#mode{position:absolute;top:max(67px,calc(env(safe-area-inset-top) + 67px));right:10px;padding:6px 8px;font-size:8px;font-weight:900;pointer-events:none;max-width:150px;text-align:center}#bar{position:absolute;left:7px;right:7px;bottom:max(7px,env(safe-area-inset-bottom));height:106px;display:flex;justify-content:center;gap:6px;padding:8px 7px 13px;background:#fff9eef7}.slot{position:relative;flex:1;max-width:90px;min-width:58px;height:82px;display:grid;grid-template-rows:52px 20px;place-items:center; div id="quest"><small>NEXT GOAL</small><div id="questTitle">Reach 5 m</div><div id="questSub">Unlock 2×2 solid building</div></div><div id="mode">⛏ PICKAXE · tap mine · drag look</div><div id="bar"><button class="slot sel" data-tool="pick"><span class="icon">⛏</span><span>PICK</span></button><button class="slot empty" data-tool="dirt"><span class="blk dirt"><b class="num" id="dc">0</b></span><span>DIRT</span></button><button class="slot locked" data-tool="stone" id="stoneSlot"><span class="blk stone"><b class="num" id="sc">0</b><i class="lock">🔒</i></span><span>STONE</span></button><button class="slot locked" disabled><span class="blk" style="background:#77828e;display:grid;place-items:center;color:white;font-size:20px">?</span><span>???</span></button></div><div id="toast" class="hide"></div><div id="load">Loading physics…</div></div><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script>(()=>{'use strict';const load=document.getElementById('load');if(!window.Matter){load.textContent='Physics failed to load';return}const{Engine,World,Bodies,Body,Query,Sleeping}=Matter,c=document.getElementById('game'),x=c.getContext('2d',{alpha:false}),B=32,H=16,DIRT=6,DEPTH=34,M={dirt:{taps:1,d:.0017,f:.74,r:.13,a:.012,col:['#98633a','#81502e','#b27845']},stone:{taps:3,d:.0028,f:.88,r:.055,a:.009,col:['#777f89','#626a74','#969ca4']}};const inv={dirt:0,stone:0},bs=new Set(),grid=new Map(),touches=new Map(),generated=new Set(),cam={x:0,y:-180,z:1,tx:0,ty:-180,tz:1,anim:false};let tool='pick',gesture=null,best=0,shape=false,stone=false,timer=null,audioOn=true,audio=null,musicTimer=null;const eng=Engine.create({enableSleeping:true});eng.gravity.y=1.05;eng.gravity.scale=.001;eng.positionIterations=8;eng.velocityIterations=6;let W=innerWidth,HH=innerHeight,DPR=Math.min(devicePixelRatio||1,2);const key=(a,b)=>a+','+b,cell=v=>Math.floor(v/B),ctr=i=>i*B+H,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const dc=document.getElementById('dc'),sc=document.getElementById('sc'),bar=document.getElementById('bar'),mode=document.getElementById('mode'),stoneSlot=document.getElementById('stoneSlot'),heightEl=document.getElementById('height'),questTitle=document.getElementById('questTitle'),questSub=document.getElementById('questSub'),topBtn=document.getElementById('top'),groundBtn=document.getElementById('ground'),soundBtn=document.getElementById('sound');function mk(px,py,m,o={}){let q=M[m],w=o.w||B-1,h=o.h||B-1,z=Bodies.rectangle(px,py,w,h,{isStatic:!!o.static,density:q.d,friction:q.f,frictionStatic:Math.min(1,q.f+.1),restitution:q.r,frictionAir:q.a,chamfer:{radius:1.2},sleepThreshold:70,label:'block:'+m});z.game={material:m,terrain:!!o.terrain,placed:!!o.placed,hits:0,max:q.taps,cx:o.cx??null,cy:o.cy??null,w,h,cost:o.cost||1,born:performance.now()};bs.add(z);if(o.terrain)grid.set(key(o.cx,o.cy),z);World.add(eng.world,z);return z}function genChunk(ch){if(generated.has(ch))return;generated.add(ch);let start=ch*24;for(let cy=0;cy<DEPTH;cy++)for(let cx=start;cx<start+24;cx++)mk(ctr(cx),ctr(cy),cy<DIRT?'dirt':'stone',{static:true,terrain:true,cx,cy})}function ensureWorld(){let ch=Math.floor(cam.x/(24*B));for(let i=ch-2;i<=ch+2;i++)genChunk(i)}ensureWorld();World.add(eng.world,Bodies.rectangle(0,(DEPTH+2)*B,1000000,B*2,{isStatic:true,label:'bedrock'}));function resize(){W=innerWidth;HH=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=HH*DPR;c.style.width=W+'px';c.style.height=HH+'px'}addEventListener('resize',resize,{passive:true});resize();const w2s=(px,py)=>({x:(px-cam.x)*cam.z+W/2,y:(py-cam.y)*cam.z+HH/2}),s2w=(px,py)=>({x:(px-W/2)/cam.z+cam.x,y:(py-HH/2)/cam.z+cam.y});function startAudio(){if(!audioOn)return;if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();scheduleMusic()}if(audio.state==='suspended')audio.resume()}function tone(freq,dur=.08,type='square',vol=.025,delay=0){if(!audioOn)return;startAudio();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur)}function sfx(k){if(k==='mine')tone(180,.045,'square',.018);if(k==='place'){tone(300,.05,'square',.02);tone(450,.06,'square',.012,.04)}if(k==='unlock'){[523,659,784,1047].forEach((n,i)=>tone(n,.18,'triangle',.035,i*.1))}}function scheduleMusic(){if(musicTimer)clearInterval(musicTimer);let seq=[262,330,392,330,294,349,440,349],i=0;musicTimer=setInterval(()=>{if(audioOn&&audio)tone(seq[i++%seq.length],.22,'triangle',.008)},430)}function toast(t,long=false){clearTimeout(timer);toastEl.textContent=t;toastEl.classList.remove('hide');timer=setTimeout(()=>toastEl.classList.add('hide'),long?3000:1300)}const toastEl=document.getElementById('toast');function at(p){let h=Query.point([...bs],p);h.sort((a,b)=>(b.game?.born||0)-(a.game?.born||0));return h[0]}function buildLimit(){return best<5?1:Math.min(10,2+Math.floor(Math.max(0,best-5)/10))}function ui(){dc.textContent=inv.dirt;sc.textContent=inv.stone;document.querySelector('[data-tool=dirt]').classList.toggle('empty',!inv.dirt);stoneSlot.classList.toggle('unlocked',stone);stoneSlot.classList.toggle('locked',!stone);mode.textContent=tool===null?'👁 VIEWER · drag anywhere':tool==='pick'?'⛏ PICKAXE · tap mine · drag look':shape?'▰ '+tool.toUpperCase()+' · max '+buildLimit()+'×'+buildLimit():'■ '+tool.toUpperCase()+' · tap 1×1 only'}function wakePlaced(){for(const q of bs)if(q.game?.placed&&!q.isStatic){Sleeping.set(q,false);Body.setVelocity(q,{x:q.velocity.x,y:q.velocity.y+.001})}}function remove(z){let n=z.game.cost||1;inv[z.game.material]+=n;if(z.game.terrain)grid.delete(key(z.game.cx,z.game.cy));bs.delete(z);World.remove(eng.world,z);wakePlaced();ui();sfx('mine')}function mine(p){let z=at(p);if(!z)return;if(z.game.material==='stone'&&!stone){toast('🔒 STONE LOCKED\nReach 10 m first!',true);tone(100,.12,'square',.02);return}z.game.hits++;z.game.flash=7;sfx('mine');if(z.game.hits>=z.game.max)remove(z)}function rect(a,b){let ax=cell(a.x),ay=cell(a.y),bx=cell(b.x),by=cell(b.y),minx=Math.min(ax,bx),maxx=Math.max(ax,bx),miny=Math.min(ay,by),maxy=Math.max(ay,by);return{minx,maxx,miny,maxy,nx:maxx-minx+1,ny:maxy-miny+1,cost:(maxx-minx+1)*(maxy-miny+1)}}function free(r){return Query.region([...bs],{min:{x:r.minx*B+2,y:r.miny*B+2},max:{x:(r.maxx+1)*B-2,y:(r.maxy+1)*B-2}}).length===0}function one(m,p){if(!inv[m])return toast('NO '+m.toUpperCase()+' — MINE SOME!');let q={minx:cell(p.x),maxx:cell(p.x),miny:cell(p.y),maxy:cell(p.y)};if(!free(q))return;inv[m]--;mk(ctr(q.minx),ctr(q.miny),m,{placed:true});ui();sfx('place')}function solid(m,a,b){let r=rect(a,b),lim=buildLimit();if(r.cost===1)return one(m,b);if(r.nx>lim||r.ny>lim)return toast('BUILD LIMIT: '+lim+'×'+lim+'\nReach '+(5+(lim-1)*10)+' m for '+Math.min(10,lim+1)+'×'+Math.min(10,lim+1)+'!',true);if(inv[m]<r.cost)return toast('NEED '+r.cost+' '+m.toUpperCase()+' · HAVE '+inv[m]);if(!free(r))return toast('SPACE IS BLOCKED');inv[m]-=r.cost;mk((r.minx+r.maxx+1)*B/2,(r.miny+r.maxy+1)*B/2,m,{w:r.nx*B-1,h:r.ny*B-1,cost:r.cost,placed:true});ui();sfx('place')}bar.addEventListener('pointerdown',e=>{e.stopPropagation();startAudio()});bar.addEventListener('pointerup',e=>e.stopPropagation());bar.addEventListener('click',e=>{e.stopPropagation();let b=e.target.closest('.slot[data-tool]');if(!b)return;let t=b.dataset.tool;if(t==='stone'&&!stone)return toast('🔒 STONE UNLOCKS AT 10 m',true);if(tool===t){tool=null;document.querySelectorAll('.slot').forEach(s=>s.classList.remove('sel'));ui();return}if(t!=='pick'&&!inv[t])return toast('MINE '+t.toUpperCase()+' FIRST');tool=t;document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('sel',s===b));ui()});function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function pan(dx,dy){cam.anim=false;cam.x-=dx/cam.z;cam.y-=dy/cam.z}function multi(){let p=[...touches.values()],a=p[0],b=p[1];return{type:'multi',mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},dist:Math.max(12,Math.hypot(a.x-b.x,a.y-b.y))}}c.addEventListener('pointerdown',e=>{startAudio();let s=pos(e);touches.set(e.pointerId,s);if(touches.size>=2){gesture=multi();return}let w=s2w(s.x,s.y);gesture={type:'play',id:e.pointerId,start:s,last:s,a:w,b:w,moved:false,t:tool}});c.addEventListener('pointermove',e=>{let s=pos(e);if(touches.has(e.pointerId))touches.set(e.pointerId,s);if(touches.size>=2){if(!gesture||gesture.type!=='multi')gesture=multi();let p=[...touches.values()],a=p[0],b=p[1],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},dist=Math.max(12,Math.hypot(a.x-b.x,a.y-b.y));pan(mid.x-gesture.mid.x,mid.y-gesture.mid.y);cam.z=clamp(cam.z*(dist/gesture.dist),.35,2.4);gesture.mid=mid;gesture.dist=dist;return}if(!gesture||gesture.type!=='play'||gesture.id!==e.pointerId)return;gesture.b=s2w(s.x,s.y);if(Math.hypot(s.x-gesture.start.x,s.y-gesture.start.y)>9)gesture.moved=true;if((gesture.t===null||gesture.t==='pick')&&gesture.moved)pan(s.x-gesture.last.x,s.y-gesture.last.y);gesture.last=s});function end(e){touches.delete(e.pointerId);if(!gesture)return;if(gesture.type==='multi'){if(touches.size<2)gesture=null;return}if(gesture.id!==e.pointerId)return;let g=gesture;gesture=null;if(g.t===null)return;if(g.t==='pick'){if(!g.moved)mine(g.b);return}if(!g.moved)one(g.t,g.b);else if(shape)solid(g.t,g.a,g.b)}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('wheel',e=>{e.preventDefault();cam.anim=false;cam.z=clamp(cam.z*(e.deltaY<0?1.1:.9),.35,2.4)},{passive:false});function topPoint(){let bestP=null;for(const q of bs)if(q.game?.placed){let minY=Math.min(...q.vertices.map(v=>v.y));if(!bestP||minY<bestP.y){let near=q.vertices.filter(v=>v.y<=minY+1.5);bestP={x:near.reduce((s,v)=>s+v.x,0)/near.length,y:minY}}}return bestP}function meters(){let p=topPoint();return p?Math.max(0,Math.round(-Math.min(0,p.y)/B)):0}function go(xp,yp){cam.tx=xp;cam.ty=yp;cam.tz=cam.z;cam.anim=true}function miningFrontier(){let cx=cell(cam.x),deep=-1;for(let cy=0;cy<DEPTH;cy++){if(!grid.has(key(cx,cy)))deep=cy;else if(deep>=0)return{x:ctr(cx),y:ctr(cy)};else if(cy===0)return{x:ctr(cx),y:ctr(0)}}return{x:ctr(cx),y:ctr(Math.min(DEPTH-1,deep+1))}}topBtn.onclick=()=>{startAudio();let p=topPoint();if(p)go(p.x,p.y);else go(cam.x,-16)};groundBtn.onclick=()=>{startAudio();let p=miningFrontier();go(p.x,p.y)};soundBtn.onclick=()=>{audioOn=!audioOn;soundBtn.textContent=audioOn?'♫ ON':'♫ OFF';if(audioOn)startAudio()};function quest(){let lim=buildLimit();if(best<5){questTitle.textContent='Reach 5 m';questSub.textContent='Unlock 2×2 solid building'}else if(best<10){questTitle.textContent='Reach 10 m';questSub.textContent='Unlock STONE mining'}else{let nextSize=Math.min(10,lim+1),nextAt=5+(lim-1)*10;if(lim<10&&best<nextAt){questTitle.textContent='Reach '+nextAt+' m';questSub.textContent='Unlock '+nextSize+'×'+nextSize+' building'}else if(best<20){questTitle.textContent='Reach 20 m';questSub.textContent='Next discovery awaits…'}else if(best<50){questTitle.textContent='Reach 50 m';questSub.textContent='Climb higher!'}else{questTitle.textContent='Reach 100 m';questSub.textContent='The sky is getting thin…'}}}function progress(){let m=meters();heightEl.textContent=m+' m';if(m>best){let old=best,oldLim=buildLimit();best=m;if(old<5&&best>=5){shape=true;toast('★ 5 m! SOLID BUILDING UNLOCKED! ★\nDrag up to 2×2.',true);sfx('unlock')}if(old<10&&best>=10){stone=true;toast('★ 10 m! STONE UNLOCKED! ★\nStone can now be mined and built with.',true);sfx('unlock')}let newLim=buildLimit();if(shape&&newLim>oldLim&&old>=5){toast('★ BUILD SIZE UPGRADED! ★\nYou can now build up to '+newLim+'×'+newLim+'.',true);sfx('unlock')}ui();quest()}}function bg(){let alt=Math.max(0,-cam.y/(B*12)),t=clamp(alt/10,0,1),mix=(a,b)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`,g=x.createLinearGradient(0,0,0,HH);g.addColorStop(0,mix([142,216,255],[17,26,55]));g.addColorStop(1,mix([209,239,255],[55,74,108]));x.fillStyle=g;x.fillRect(0,0,W,HH);if(t>.15){x.globalAlpha=clamp((t-.15)*1.2,0,.8);x.fillStyle='#fff';for(let i=0;i<50;i++)x.fillRect((i*137%997)/997*W,(i*233%991)/991*HH,1+(i%7===0),1+(i%7===0));x.globalAlpha=1}let l=w2s(cam.x-W/cam.z,0),r=w2s(cam.x+W/cam.z,0);x.fillStyle='#72b552';x.fillRect(l.x,l.y-5*cam.z,r.x-l.x,6*cam.z)}function draw(z){let s=w2s(z.position.x,z.position.y),sw=z.game.w*cam.z,sh=z.game.h*cam.z;if(s.x+sw/2<0||s.x-sw/2>W||s.y+sh/2<0||s.y-sh/2>HH)return;let q=M[z.game.material];x.save();x.translate(s.x,s.y);x.rotate(z.angle);x.fillStyle=q.col[0];x.fillRect(-sw/2,-sh/2,sw,sh);x.fillStyle=q.col[1];x.fillRect(-sw/2,sh/2-Math.max(2,3*cam.z),sw,Math.max(2,3*cam.z));x.fillRect(-sw/2,-sh/2,Math.max(2,2*cam.z),sh);if(z.game.flash>0){x.strokeStyle='#fff3a0';x.lineWidth=3;x.strokeRect(-sw/2+2,-sh/2+2,sw-4,sh-4);z.game.flash--}x.restore()}function preview(){if(!gesture||gesture.type!=='play'||!M[gesture.t]||!shape||!gesture.moved)return;let r=rect(gesture.a,gesture.b),a=w2s(r.minx*B,r.miny*B),w=r.nx*B*cam.z,h=r.ny*B*cam.z,lim=buildLimit(),ok=r.nx<=lim&&r.ny<=lim&&inv[gesture.t]>=r.cost;x.globalAlpha=ok?.38:.13;x.fillStyle=M[gesture.t].col[0];x.fillRect(a.x,a.y,w,h);x.strokeStyle='#172b40';x.lineWidth=3;x.strokeRect(a.x,a.y,w,h);x.globalAlpha=1;x.fillStyle='#fff';x.font='900 12px ui-monospace';x.fillText(r.nx+'×'+r.ny+' · '+r.cost,a.x+5,a.y+16)}function animate(){if(!cam.anim)return;cam.x+=(cam.tx-cam.x)*.12;cam.y+=(cam.ty-cam.y)*.12;if(Math.abs(cam.tx-cam.x)<.3&&Math.abs(cam.ty-cam.y)<.3)cam.anim=false}let last=performance.now();function loop(now){Engine.update(eng,Math.min(33,now-last||16));last=now;animate();ensureWorld();progress();x.setTransform(DPR,0,0,DPR,0,0);bg();for(let z of bs)draw(z);preview();requestAnimationFrame(loop)}ui();quest();load.remove();toast('MINE DIRT. BUILD UP.');requestAnimationFrame(loop)})();</script></body></html>
